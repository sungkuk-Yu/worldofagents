<!-- ============ FRAME 01 · 음성홈 기본 (화면 7) ============ -->

            <span class="st on"></span>

          <div class="pulse p2"></div>

        <div style="text-align:center;display:flex;flex-direction:column;gap:6px">
          <div style="font:var(--t-title2);color:var(--text-1)">머스크야, 이거 해줘</div>

        </div>
      </div>

      <!-- 하단: 힌트 가드 -->
      <div style="position:absolute;bottom:34px;left:0;right:0;display:flex;justify-content:center;gap:8px">
        <span class="chip">← 예</span>
        <span class="chip active">◉ 녹음</span>

    </div>
