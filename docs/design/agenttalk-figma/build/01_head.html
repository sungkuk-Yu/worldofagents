<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>에이전트톡 (AgentTalk) — Figma Design System · 모던 UX v1.0</title>
<style>
/* ============================================================
   에이전트톡 디자인 시스템 — Design Tokens (다크 모드)
   - 채팅버블 탈피: 기능 중심 / 사각형 카드 / 모던 미니멀
   - 모바일 우선: 390×844 기준, 반응형 (태블릿/데스크톱)
   ============================================================ */
:root{
  /* Color — Surface */
  --bg:            #0A0C10;
  --surface:       #12151C;
  --surface-raise: #181C25;
  --surface-hover: #1E2330;
  --overlay:       rgba(10,12,16,.72);

  /* Color — Border */
  --border:        #252B39;
  --border-strong: #323A4D;

  /* Color — Text */
  --text-1: #F2F4F8;
  --text-2: #A6AFC1;
  --text-3: #606B80;
  --text-dis: rgba(242,244,248,.34);

  /* Color — Accent (최소 팔레트) */
  --primary:     #5B8CFF;   /* 메인 액센트 — 상호작용 */
  --primary-soft:rgba(91,140,255,.14);
  --on-primary:  #0A0C10;

  /* Color — Segment (기능 단위 식별색, 사용 최소화) */
  --seg-info:  #4CC9F0;  /* 정보 */
  --seg-data:  #9B7BF3;  /* 데이터 */
  --seg-file:  #FFB454;  /* 파일 */
  --seg-task:  #4ADE80;  /* 작업 */
  --seg-multi: #FB7185;  /* 멀티에이전트 */

  /* Color — Status */
  --ok:     #4ADE80;
  --warn:   #FBBF24;
  --err:    #F87171;
  --neutral:#6B7280;

  /* Radius — 사각형 카드 (극소 반경) */
  --r-xs: 4px;  --r-sm: 6px;  --r-md: 8px;  --r-lg: 12px;  --r-full: 999px;

  /* Spacing — 4pt 그리드 */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px;
  --sp-6:24px; --sp-8:32px; --sp-10:40px;

  /* Type */
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro KR",
          "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", Roboto, sans-serif;
  --t-display: 700 34px/1.15 var(--font);
  --t-title1:  700 28px/1.2  var(--font);
  --t-title2:  700 22px/1.25 var(--font);
  --t-headline:600 17px/1.3  var(--font);
  --t-body:    400 15px/1.5  var(--font);
  --t-body-b:  600 15px/1.4  var(--font);
  --t-sub:     500 13px/1.45 var(--font);
  --t-caption: 500 12px/1.4  var(--font);
  --t-micro:   500 11px/1.3  var(--font);

  /* Shadow */
  --sh-1: 0 1px 2px rgba(0,0,0,.4);
  --sh-2: 0 4px 14px rgba(0,0,0,.45);
  --sh-3: 0 12px 32px rgba(0,0,0,.55);
}

*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{
  font:var(--t-body);color:var(--text-1);background:#10131A;
  min-height:100vh;
}
::selection{background:rgba(91,140,255,.35)}

/* ============ 도큐먼트 헤더 ============ */
.doc-header{
  padding:40px 48px 24px;
  border-bottom:1px solid #222836;
  background:linear-gradient(180deg,#131722 0%,#10131A 100%);
}
.doc-header h1{font:var(--t-display);letter-spacing:-.5px}
.doc-header .sub{margin-top:8px;color:var(--text-2);font:var(--t-body)}
.doc-header .tags{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap}
.tag{
  font:var(--t-micro);color:var(--text-2);
  border:1px solid var(--border);background:var(--surface);
  padding:6px 10px;border-radius:var(--r-full);letter-spacing:.2px;
}
.tag.hot{color:var(--primary);border-color:rgba(91,140,255,.5);background:var(--primary-soft)}

/* ============ 캔버스 (Figma 캔버스 역할) ============ */
.canvas{
  padding:48px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(410px,1fr));
  gap:56px 40px;align-items:start;justify-items:center;
}
.frame{
  display:flex;flex-direction:column;gap:10px;align-items:center;
}
.frame-art{
  position:relative;width:390px;height:844px;background:var(--bg);
  border:1px solid #2A3140;border-radius:14px;overflow:hidden;
  box-shadow:var(--sh-3);flex:none;
}
.frame-art.wide{width:auto;height:auto;aspect-ratio:auto;border-radius:10px}
.frame-art.scaled{transform:scale(.92);transform-origin:top center}
.frame-label{
  font:var(--t-micro);color:var(--text-3);letter-spacing:.4px;
  text-align:center;max-width:430px;line-height:1.5;
}
.frame-label b{color:var(--text-1);font-weight:600}
.frame .fr-badge{
  font:var(--t-micro);color:var(--bg);background:var(--text-2);
  border-radius:var(--r-xs);padding:2px 7px;letter-spacing:.3px;
}

/* ============ 공통: 스크린 뼈대 ============ */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
.statusbar{
  position:absolute;top:0;left:0;right:0;z-index:30;
  height:44px;display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;font:600 14px/1 var(--font);
}
.statusbar .sb-right{display:flex;align-items:center;gap:6px}
.sb-dyn{position:absolute;top:12px;left:50%;transform:translateX(-50%);
  width:120px;height:26px;background:#000;border-radius:20px;z-index:31}
.battery{width:22px;height:11px;border:1px solid var(--text-2);border-radius:3px;position:relative;padding:1.5px}
.battery::after{content:"";position:absolute;inset:1.5px;right:auto;width:60%;background:var(--text-1);border-radius:1px}
.battery::before{content:"";position:absolute;right:-3px;top:3px;width:2px;height:4px;background:var(--text-2);border-radius:0 1px 1px 0}
.ico{width:1em;height:1em;display:inline-block;vertical-align:-.15em;flex:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

/* ============ 공통 위젯 ============ */
.avatar{position:relative;border-radius:var(--r-full);flex:none;display:inline-flex;
  align-items:center;justify-content:center;overflow:visible}
.avatar .ring{position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--primary);opacity:.9}
.avatar.sm{width:28px;height:28px;font-size:13px}
.avatar.md{width:36px;height:36px;font-size:15px}
.avatar.lg{width:48px;height:48px;font-size:18px}
.avatar .st{position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;
  border:2px solid var(--bg)}
.st.on{background:var(--ok)} .st.work{background:var(--warn)} .st.off{background:var(--neutral)}

.chip{
  display:inline-flex;align-items:center;gap:6px;
  font:var(--t-micro);padding:5px 10px;border-radius:var(--r-full);
  border:1px solid var(--border);background:var(--surface-raise);color:var(--text-2);
}
.chip.active{color:var(--primary);border-color:rgba(91,140,255,.55);background:var(--primary-soft)}
.chip.ok{color:var(--ok);border-color:rgba(74,222,128,.4);background:rgba(74,222,128,.08)}
.chip.warn{color:var(--warn);border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.08)}
.chip.plain{color:var(--text-1);background:var(--surface-raise)}

.badge{display:inline-flex;align-items:center;gap:4px;font:var(--t-micro);font-weight:600;
  padding:2px 7px;border-radius:var(--r-xs)}
.badge.ok{color:var(--ok);background:rgba(74,222,128,.12)}
.badge.warn{color:var(--warn);background:rgba(251,191,36,.12)}
.badge.err{color:var(--err);background:rgba(248,113,113,.12)}
.badge.off{color:var(--text-2);background:rgba(96,107,128,.18)}
.badge.main{color:var(--primary);background:var(--primary-soft)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font:var(--t-body-b);padding:12px 16px;border-radius:var(--r-md);
  border:1px solid transparent;transition:filter .15s;
}
.btn:active{filter:brightness(.9)}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-secondary{background:var(--surface-raise);color:var(--text-1);border-color:var(--border-strong)}
.btn-ghost{background:transparent;color:var(--text-2);border-color:var(--border)}
.btn-danger{background:rgba(248,113,113,.12);color:var(--err);border-color:rgba(248,113,113,.3)}
.btn-lg{padding:15px 20px;font:700 16px/1.3 var(--font)}
.btn-sm{padding:8px 12px;font:var(--t-sub)}

.divider{height:1px;background:var(--border);border:none;width:100%}

/* ============ 세그먼트 시그니처 ============ */
.seg-ico{width:34px;height:34px;border-radius:var(--r-md);display:inline-flex;align-items:center;
  justify-content:center;flex:none}
.seg-ico svg{width:19px;height:19px}
.seg-info{background:rgba(76,201,240,.14);color:var(--seg-info)}
.seg-data{background:rgba(155,123,243,.14);color:var(--seg-data)}
.seg-file{background:rgba(255,180,84,.14);color:var(--seg-file)}
.seg-task{background:rgba(74,222,128,.14);color:var(--seg-task)}
.seg-multi{background:rgba(251,113,133,.14);color:var(--seg-multi)}
.seg-ic-sm{width:24px;height:24px;border-radius:var(--r-sm)}
.seg-ic-sm svg{width:14px;height:14px}

.c-type{display:inline-flex;align-items:center;gap:7px;font:var(--t-caption);color:var(--text-2)}

/* ============ 세그먼트 히스토리 바 (하단 연결형) ============ */
.segbar{
  position:relative;display:flex;align-items:center;gap:0;padding:8px 14px;
  background:linear-gradient(180deg,rgba(18,21,28,.96),rgba(18,21,28,.88));
  border-top:1px solid var(--border);
}
.segbar .sb-scroll{display:flex;align-items:center;gap:0;overflow:hidden;flex:1;
  justify-content:center;
}
.segbar .seg-node{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;
  width:56px;flex:none;cursor:pointer}
.segbar .seg-node .dot-wrap{position:relative;display:flex;align-items:center;justify-content:center}
.segbar .seg-node .dot{
  width:30px;height:6px;border-radius:var(--r-full);background:var(--surface-hover);
  border:1px solid var(--border-strong);transition:all .2s;position:relative;
}
.segbar .seg-node .lbl{font:var(--t-micro);color:var(--text-3);white-space:nowrap;letter-spacing:.2px}
.segbar .seg-node .c-ico{
  width:26px;height:26px;border-radius:var(--r-sm);background:var(--surface);
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--border);
}
.segbar .seg-node .c-ico svg{width:14px;height:14px}
.segbar .seg-node.past .c-ico{border-color:var(--border)}
.segbar .seg-node.past .lbl{color:var(--text-3)}
.segbar .seg-node.current .c-ico{border-color:var(--seg-c,var(--primary));
  background:color-mix(in srgb,var(--seg-c,var(--primary)) 16%,var(--surface));
  box-shadow:0 0 12px color-mix(in srgb,var(--seg-c,var(--primary)) 35%,transparent)}
.segbar .seg-node.current .lbl{color:var(--text-1);font-weight:700}
.segbar .seg-node .new-dot{position:absolute;top:-2px;right:-2px;width:7px;height:7px;
  border-radius:50%;background:var(--seg-c,var(--primary));border:1.5px solid var(--bg)}
.segbar .seg-link{width:12px;height:1.5px;background:var(--border-strong);flex:none;
  margin-top:-14px;position:relative}
.segbar .seg-link.done{background:var(--seg-c,var(--primary));opacity:.55}
.segbar .seg-bar-title{font:var(--t-micro);color:var(--text-3);padding:0 4px 6px;text-align:center;
  letter-spacing:2px}
.segbar .more{width:26px;height:26px;flex:none;border-radius:var(--r-sm);
  border:1px dashed var(--border-strong);color:var(--text-2);font:var(--t-micro);
  display:flex;align-items:center;justify-content:center}

/* 상단 얇은 세그먼트 진행바 (화면 10 변형) */
.seg-progress{display:flex;align-items:center;gap:6px;padding:10px 24px 6px}
.seg-progress .s{flex:1;height:2.5px;border-radius:2px;background:var(--surface-hover)}
.seg-progress .s.done{background:var(--primary)}
.seg-progress .s.cur{background:var(--primary);box-shadow:0 0 8px rgba(91,140,255,.7)}

/* ============ 조이스틱 마이크 ============ */
.joystick{position:relative;width:150px;height:150px}
.joystick .pulse{position:absolute;inset:0;border-radius:50%;
  border:1.5px solid var(--primary);opacity:.25;animation:pulse 2.2s ease-out infinite}
.joystick .pulse.p2{animation-delay:1.1s}
@keyframes pulse{0%{transform:scale(.86);opacity:.45}100%{transform:scale(1.14);opacity:0}}
.joystick .core{
  position:absolute;inset:34px;border-radius:50%;
  background:radial-gradient(circle at 32% 28%, #1E2534 0%, #151A26 58%, #0E1118 100%);
  border:1.5px solid var(--border-strong);
  display:flex;align-items:center;justify-content:center;color:var(--text-1);
  box-shadow:var(--sh-2), inset 0 1px 0 rgba(255,255,255,.06);
  transition:transform .15s;
}
.joystick .core svg{width:44px;height:44px}
.joystick .core.rec{background:radial-gradient(circle at 32% 28%, #3A1320 0%, #23101B 58%, #140A10 100%);
  border-color:rgba(248,113,113,.65);color:var(--err);}
.joystick .dir{
  position:absolute;display:flex;flex-direction:column;align-items:center;gap:3px;
  font:var(--t-micro);color:var(--text-2);
}
.joystick .dir .d-arrow{width:26px;height:26px;border-radius:50%;
  background:var(--surface-raise);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;opacity:.9}
.joystick .dir .d-arrow svg{width:13px;height:13px}
.joystick .dir.lock .d-arrow{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)
  ;box-shadow:0 0 10px rgba(91,140,255,.35)}
.joystick .dir-l{left:-6px;top:50%;transform:translateY(-50%)}
.joystick .dir-r{right:-6px;top:50%;transform:translateY(-50%)}
.joystick .dir-u{top:-2px;left:50%;transform:translateX(-50%)}
.joystick .dir-d{bottom:-2px;left:50%;transform:translateX(-50%)}
.joystick .dir-ul{left:8px;top:14px}
.joystick .dir-ur{right:8px;top:14px}
.joystick .dir-dl{left:8px;bottom:14px}
.joystick .dir-dr{right:8px;bottom:14px}

/* waveform */
.wave{display:flex;align-items:center;gap:3px;height:28px}
.wave i{width:3px;border-radius:2px;background:var(--primary);opacity:.85}
.wave i.rec{background:var(--err)}

/* ============ 카드 & 타이포 ============ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:var(--sp-4);position:relative}
.card.hero{background:linear-gradient(180deg,var(--surface-raise) 0%,var(--surface) 100%)}
.t1 .card{border-radius:var(--r-md)}

/* ============ 프레임별 특화 ============ */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 6px}

/* 음성홈 */
.vh-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
  padding:0 24px 110px}
.vh-quip{font:var(--t-sub);color:var(--text-3);text-align:center;line-height:1.6}

/* 스레드 */
.thread-row{display:flex;gap:12px;padding:12px 16px}
.thread-row .t-body{flex:1;min-width:0}
.thread-row .t-meta{font:var(--t-micro);color:var(--text-3);display:flex;gap:8px;align-items:baseline}
.thread-row .t-name{font:var(--t-sub);font-weight:700}
.thread-row .t-text{font:var(--t-body);margin-top:3px;color:var(--text-1);line-height:1.5}
.refbar{position:relative;margin:8px 12px 0;background:var(--surface-raise);
  border:1px solid var(--border-strong);border-left:3px solid var(--primary);
  border-radius:var(--r-md);padding:10px 12px;display:flex;gap:10px;align-items:center}

/* 스프레드시트 */
.tbl{width:100%;border-collapse:collapse;font:var(--t-caption);table-layout:fixed}
.tbl th{font:var(--t-micro);color:var(--text-2);text-align:left;font-weight:600;
  padding:7px 8px;border-bottom:1px solid var(--border-strong);background:var(--surface-raise);
  position:sticky;top:0}
.tbl td{padding:8px;border-bottom:1px solid var(--border);color:var(--text-1);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.tbl tr:last-child td{border-bottom:none}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl td.sel{outline:2px solid var(--primary);outline-offset:-2px;background:var(--primary-soft)}
.tbl .hd-sel th{color:var(--primary);background:rgba(91,140,255,.1)}

/* 타임라인 */
.tl{position:relative;padding-left:20px}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;
  background:var(--border-strong)}
.tl .tl-item{position:relative;padding:0 0 14px 12px}
.tl .tl-item::before{content:"";position:absolute;left:-19px;top:5px;width:10px;height:10px;
  border-radius:50%;background:var(--surface-raise);border:2px solid var(--border-strong)}
.tl .tl-item.c::before{background:var(--ok);border-color:var(--ok)}
.tl .tl-item.w::before{background:var(--warn);border-color:var(--warn)}
.tl .tl-item.r::before{background:var(--primary);border-color:var(--primary)}
.tl .tl-time{font:var(--t-micro);color:var(--text-3)}
.tl .tl-text{font:var(--t-sub);color:var(--text-1);margin-top:2px}

/* 스테퍼 */
.stepper{display:flex;align-items:center;gap:0}
.step{display:flex;flex-direction:column;align-items:center;flex:1;position:relative}
.step .s-dot{width:22px;height:22px;border-radius:50%;background:var(--surface-raise);
  border:2px solid var(--border-strong);display:flex;align-items:center;justify-content:center;
  color:transparent;z-index:1}
.step.done .s-dot{background:var(--ok);border-color:var(--ok);color:#08130C}
.step.cur .s-dot{border-color:var(--primary);color:var(--primary);
  box-shadow:0 0 10px rgba(91,140,255,.4)}
.step .s-lbl{font:var(--t-micro);color:var(--text-3);margin-top:6px}
.step.done .s-lbl,.step.cur .s-lbl{color:var(--text-1)}
.step .s-line{position:absolute;top:11px;height:2px;background:var(--border-strong);
  left:-50%;right:50%;z-index:0}
.step:first-child .s-line{display:none}
.step.done .s-line{background:var(--ok)}

/* 멀티에이전트 노드 */
.ma-map{display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 0}
.ma-node{display:flex;flex-direction:column;align-items:center;gap:6px;width:74px}
.ma-node .role{font:var(--t-micro);color:var(--text-2);padding:3px 8px;border-radius:var(--r-full);
  border:1px solid var(--border);background:var(--surface-raise)}
.ma-link{width:34px;height:2px;background:var(--border-strong);position:relative;margin-top:-20px}
.ma-link.on{background:var(--primary)}
.ma-link.on::after{content:"";position:absolute;top:-2px;left:50%;width:6px;height:6px;
  border-radius:50%;background:var(--primary);transform:translateX(-50%)}

/* PDF 미니페이지 */
.pdf-page{background:#F5F1E8;border-radius:var(--r-xs);color:#3A3A3A;
  padding:10px;font:var(--t-micro);line-height:1.55;position:relative}
.hl{background:rgba(255,180,84,.4);padding:0 2px;border-radius:2px}

/* 컴포넌트 라이브러리 그리드 */
.lib{position:absolute;inset:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:18px}
.lib h4{font:var(--t-caption);color:var(--text-3);letter-spacing:1.2px;text-transform:uppercase;
  margin-bottom:10px}
.lib .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lib .cell{display:flex;flex-direction:column;gap:8px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--r-md);padding:14px}
.lib .lbl{font:var(--t-micro);color:var(--text-3)}

/* 반응형 데모 */
.rx-desktop .topbar,.rx-desktop .statusbar{width:100%}
.rx-split{display:flex;height:100%}
.rx-side{width:300px;border-right:1px solid var(--border);background:var(--surface);
  overflow:hidden;display:flex;flex-direction:column}

/* 스크롤바 */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#2A3140;border-radius:3px}
::-webkit-scrollbar-track{background:transparent}
