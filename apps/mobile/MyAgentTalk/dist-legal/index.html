    <style id="mat-motion">
      /* 화면 전환 — 애플 감성 (#52): 웹은 react-native-screens no-op → CSS keyframes 폴백.
         곡선 cubic-bezier(0.32,0.72,0,1) = Apple 계열 snappy 스프링 근사 (오버슈트 없음). */
      @keyframes mat-slide-from-right {
        from { transform: translateX(100%); }
        to { transform: translateX(0); }
      }
      @keyframes mat-slide-from-bottom {
        from { transform: translateY(100%); }
        to { transform: translateY(0); }
      }
      /* 동작 줄이기 (Apple HIG Motion / #52 규칙 7) — 전환·펼침 애니메이션 전부 생략 */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
